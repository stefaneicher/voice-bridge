<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tray-Menü – Voice-Bridge Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2AA5A1}a:hover{color:#9AF2CF}
</style>
<style>html{background:#15151C}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 480px; height: 760px; position: relative; overflow: hidden; background: #1D2230; font-family: Inter, system-ui, sans-serif">

  <div style="position: absolute; right: 16px; bottom: 60px; width: 400px; box-sizing: border-box; background: #15151C; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; box-shadow: 0 24px 70px rgba(0,0,0,.6); overflow: hidden">

    <div style="padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="display: flex; width: 32px; height: 32px; border-radius: 10px; background: #2AA5A1; color: #15151C; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"></path></svg></span>
        <span style="font-family:  sans-serif; font-size: 18px; font-weight: 600; color: #EDF6F3">Voice-Bridge</span>
        <span style="margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AF2CF"><span style="width: 7px; height: 7px; border-radius: 50%; background: #2AA5A1"></span>Bereit</span>
      </div>
      <div role="radiogroup" aria-label="Profil" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #24242F; border-radius: 12px">
        <button role="radio" aria-checked="true" style="height: 40px; border: 0; border-radius: 9px; background: #2A2F3A; color: #EDF6F3; font: 600 13px Inter, sans-serif; cursor: pointer">Privat</button>
        <button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #AEB5C2; font: 500 13px Inter, sans-serif; cursor: pointer">Geschäft</button>
      </div>
    </div>

    <div style="padding: 0 18px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #DDE2EA">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEB5C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 17v4"></path></svg>
        <span>USB-Headset</span>
        <div style="margin-left: auto; display: flex; gap: 3px" role="img" aria-label="Pegel 60 Prozent">
          <span style="width: 6px; height: 12px; border-radius: 2px; background: #2AA5A1"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2AA5A1"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2AA5A1"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2AA5A1"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2AA5A1"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2AA5A1"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2A2F3A"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2A2F3A"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2A2F3A"></span><span style="width: 6px; height: 12px; border-radius: 2px; background: #2A2F3A"></span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #DDE2EA">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEB5C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12 3.5 3.5 0 0 0 6 19z"></path></svg>
        <span>OpenAI · gpt-4o-transcribe</span>
        <span style="margin-left: auto; font-size: 11px; color: #C4E58F; border: 1px solid rgba(163,216,88,.4); padding: 3px 8px; border-radius: 10px">Cloud</span>
      </div>
    </div>

    <div style="padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.07); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #24242F; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9A9CAB">Diktat</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #EDF6F3"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2AA5A1"></span>Maus 4</span>
      </div>
      <div style="background: #24242F; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9A9CAB">Agent</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #EDF6F3"><span style="width: 8px; height: 8px; border-radius: 50%; background: #A3D858"></span>Maus 5</span>
      </div>
    </div>

    <div style="padding: 12px 18px 6px; border-top: 1px solid rgba(255,255,255,.07); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9A9CAB">Zuletzt</div>
    <div style="padding: 0 10px 10px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px">
        <span style="width: 6px; height: 6px; flex: none; border-radius: 50%; background: #A3D858"></span>
        <span style="flex: 1; min-width: 0; font-size: 13px; color: #DDE2EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">→ billing-service: Bitte zuerst die Rundungsfehler …</span>
        <button aria-label="Kopieren" style="display: flex; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #AEB5C2; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px">
        <span style="width: 6px; height: 6px; flex: none; border-radius: 50%; background: #2AA5A1"></span>
        <span style="flex: 1; min-width: 0; font-size: 13px; color: #DDE2EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Die Migration der Preislogik ist abgeschlossen …</span>
        <button aria-label="Kopieren" style="display: flex; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #AEB5C2; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px">
        <span style="width: 6px; height: 6px; flex: none; border-radius: 50%; background: #FF5A5F"></span>
        <span style="flex: 1; min-width: 0; font-size: 13px; color: #DDE2EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nicht gesendet: Prüf bitte, ob das Deploy-Skript …</span>
        <button aria-label="Kopieren" style="display: flex; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #AEB5C2; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; gap: 4px; padding: 8px; background: #1D1D27; border-top: 1px solid rgba(255,255,255,.07)">
      <button style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #DDE2EA; font: 500 13px Inter, sans-serif; cursor: pointer">Pausieren</button>
      <button style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #DDE2EA; font: 500 13px Inter, sans-serif; cursor: pointer">Einstellungen</button>
      <button style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #AEB5C2; font: 500 13px Inter, sans-serif; cursor: pointer">Beenden</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #1D1D27; border-top: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 18px; color: #C6CAD3; font-size: 12px">
    <span style="display: flex; width: 32px; height: 32px; border-radius: 6px; background: rgba(255,255,255,.08); color: #2AA5A1; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Voice-Bridge"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 17v4"></path></svg></span>
    <span>12:17</span>
  </div>
</div>
</body>
</html>
