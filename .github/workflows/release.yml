name: Release

# Builds and publishes a release. Normally called by release-please.yml after a release PR is
# merged. Can also be started by hand (workflow_dispatch on main: builds that commit and creates
# the tag) or by pushing a tag v*.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Started by hand, the tag may not exist yet: build the dispatched commit, tag it on publish.
  REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG passt nicht zu package.json ($version)"
            exit 1
          fi
      - run: npm ci
      - name: No known high or critical vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer and portable exe
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  npm-package:
    needs: verify
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack (Electron becomes a runtime dependency)
        run: node scripts/pack.mjs dist-npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: dist-npm/*.tgz
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Release keystore from secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VB_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 nicht gesetzt – APK wird mit einem Debug-Schlüssel signiert."
          fi
      - name: Build APK
        working-directory: android
        env:
          VB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VB_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VB_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          IFS=. read -r major minor patch <<< "$version"
          export VB_VERSION_NAME="$version"
          export VB_VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))
          ./gradlew --no-configuration-cache assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../voice-bridge-android-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: voice-bridge-android-*.apk
          if-no-files-found: error

  publish:
    needs: [windows, npm-package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: GitHub Release (create, or attach to the one release-please made)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "Voice-Bridge $TAG" --generate-notes \
              --target "$(git rev-parse HEAD)"
          fi
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo "@stefaneicher:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm publish ./artifacts/*.tgz --registry https://npm.pkg.github.com
          rm .npmrc
      - name: Publish to npmjs.com (only if NPM_TOKEN is set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN nicht gesetzt – Veröffentlichung auf npmjs.com übersprungen."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish ./artifacts/*.tgz --access public --provenance
          rm .npmrc
